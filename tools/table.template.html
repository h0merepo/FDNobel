<title>Nobel Atlas — Table</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   THE TABLE

   One 55-inch surface, four people around it. Four copies of the atlas sit
   on top — two of them turned to face the other side of the table — and
   under all four runs a single connected plane of material that is out of
   reach: blurred, drifting, and never touchable.

   The four zones are windows onto the same build. It is carried inline
   rather than framed from its own page, because the artifact host answers
   with `frame-ancestors 'self'` and will not let one artifact embed
   another. Rebuild this file from the shortlist and all four update.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* The atlas's own ground. With the stations transparent this is the only
     ground on the table, so it is that colour exactly and not a shade near it. */
  --table: #262320;
  --gold: #cea152;
  --pale: #d1ccbe;
  --warm: #b0a8a1;
  --pink: #f5318b;
  --physics: #a6a6a6;
  --chemistry: #0c3d51;
  --medicine: #2c8293;
  --literature: #c25f1b;
  --peace: #bac9d9;
  --economics: #96ae7e;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--table);
  font-family: 'Alfred Sans', system-ui, sans-serif;
  color: var(--pale);
  -webkit-font-smoothing: antialiased;
}

/* Fixed and full-bleed, carrying the ground itself rather than leaving it to
   body. A host page wraps this one and paints its own light ground on body;
   an element rule beats that whatever order the two stylesheets end up in,
   and filling the viewport directly means the surface does not depend on
   body having been given a height either. Everything on the table is inside
   it, so nothing else is ever seen. */
.table {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--table);
}

/* ── the field under the whole table ─────────────────────────────────────
   The atlas's own out-of-focus field, drawn once at the size of the table
   instead of four times at the size of a station. That is the whole point:
   four copies of a field cannot line up at the seams between them, and a
   field that stops at a station's edge draws that edge. This one runs under
   all four and is the only ground any of them has.

   Six bands at six depths, each with its own blur and its own rate of drift,
   so the field separates the way a lens separates it. Nothing here takes a
   touch — the surface belongs to the stations. */
.depth {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* Each layer stands 124% of the table and hangs 12% past every edge, so it
   still covers the surface once the drift has pushed it. Given as insets, not
   as a width with a negative margin: a percentage margin resolves against the
   containing block's width in both axes, which on a 16:9 table lifts every
   layer most of a screen height out of place. */
.band {
  position: absolute;
  inset: -12%;
  will-change: transform;
}

.band svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.band .node {
  position: absolute;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

/* ── the four stations ───────────────────────────────────────────────────
   No ground, no frame, no shadow, and no gap: each station is transparent,
   so what stands behind all four is the one field. The four together cover
   the table, which is what lets a station's circles drift out past the area
   its own controls sit in — there is no edge for them to stop at. Where two
   stations meet, each has already faded its own field out (see .page-layer
   in the atlas's stylesheet), so the seam is a soft band of the field rather
   than a line. */
.zones {
  position: absolute;
  inset: 0;
}

.zone {
  position: absolute;
  width: 50%;
  height: 50%;
  overflow: hidden;
}

.zone.left { left: 0; }
.zone.right { right: 0; }
.zone.top { top: 0; }
.zone.bottom { bottom: 0; }

/* Two of the four face the other side of the table. */
.zone.turned { transform: rotate(180deg); }

/* The atlas lays itself out differently below a certain width, so each zone
   runs it at a thousand logical pixels and scales that to the slot — up as
   well as down. The table is one physical object; a 4K panel should show the
   same composition as a 1080 one at the same size on the glass, not the same
   layout at half of it. Scaling a live document keeps its text vector, so
   magnifying it costs no sharpness. */
.fit {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
}

.fit iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

@media (prefers-reduced-motion: reduce) {
  .band { transition: none; }
}
</style>

<div class="table">
  <div class="depth" id="depth"></div>

  <div class="zones">
    <div class="zone top left turned"><div class="fit"><iframe title="Nobel Atlas"></iframe></div></div>
    <div class="zone top right turned"><div class="fit"><iframe title="Nobel Atlas"></iframe></div></div>
    <div class="zone bottom left"><div class="fit"><iframe title="Nobel Atlas"></iframe></div></div>
    <div class="zone bottom right"><div class="fit"><iframe title="Nobel Atlas"></iframe></div></div>
  </div>
</div>

<script id="app" type="application/octet-stream">__APP_B64__</script>

<script>
(function () {
  'use strict'

  /* ── the atlas, into all four zones ───────────────────────────────────
     Written into each frame as a real document rather than handed over as
     an attribute: a build this long parses either way, but only a real
     parse runs the scripts it is built on. The four are staggered so the
     panel is not asked to parse four of them in the same frame. */
  const html = new TextDecoder().decode(
    Uint8Array.from(atob(document.getElementById('app').textContent.trim()), (c) => c.charCodeAt(0)),
  )

  const frames = [].slice.call(document.querySelectorAll('.fit iframe'))
  frames.forEach(function (frame, i) {
    setTimeout(function () {
      const doc = frame.contentDocument
      if (!doc) return
      // How the atlas is told it is on the table and should drop its own
      // ground. A name survives the write that follows; a variable set on the
      // window would not, and "am I framed?" would also be true of the atlas
      // published on its own, which the host frames.
      frame.contentWindow.name = 'atlas-surface'
      doc.open()
      doc.write(html)
      doc.close()
      // Which of this station's own sides face the middle of the table. The
      // top always does — the two far stations are turned, so their frame's
      // top is the table's centre line just as the near pair's is. The other
      // is whichever side the neighbour is on, read in the station's own
      // frame, so it flips for the pair that is turned.
      doc.documentElement.dataset.seam =
        'top ' + (frame.closest('.zone').matches('.left:not(.turned), .right.turned') ? 'right' : 'left')
    }, i * 220)
  })

  /* ── each zone scales its copy to its slot ─────────────────────────── */
  const LOGICAL = 1000

  function fit() {
    document.querySelectorAll('.zone').forEach(function (zone) {
      const box = zone.getBoundingClientRect()
      if (!box.width) return
      const scale = box.width / LOGICAL
      const inner = zone.querySelector('.fit')
      inner.style.width = box.width / scale + 'px'
      inner.style.height = box.height / scale + 'px'
      inner.style.transform = 'scale(' + scale.toFixed(4) + ')'
    })
  }

  /* ── the field ────────────────────────────────────────────────────────
     The atlas's own out-of-focus circles, in its own palette, at its own
     sizes — but generated once across the whole table instead of once per
     station. Density is set to match what a single station used to carry, so
     the surface looks the same as it always did; it is only that it no longer
     stops at anybody's edge.

     The circles are sorted into depth bands, which is what puts them in and
     out of focus and what gives each depth its own rate of drift. Generated
     from one seed, so the table comes up the same every time it is switched
     on. */
  function rng(seed) {
    let h = 2166136261
    for (let i = 0; i < seed.length; i += 1) {
      h ^= seed.charCodeAt(i)
      h = Math.imul(h, 16777619)
    }
    return function () {
      h = Math.imul(h ^ (h >>> 15), h | 1)
      h ^= h + Math.imul(h ^ (h >>> 7), h | 61)
      return ((h ^ (h >>> 14)) >>> 0) / 4294967296
    }
  }

  // the atlas's ambient palette, unchanged
  const TONES = ['--gold', '--pale', '--warm', '--pink', '--literature', '--medicine', '--peace']

  const BANDS = 6
  const FOCUS = 3 // the depth the lens is held at; the rest falls away from it
  // A station carried about thirty of these over a quarter of the table, and
  // the field should read at that density over the whole of it.
  const CIRCLES = 96

  const depth = document.getElementById('depth')
  const r = rng('nobel-atlas-table')
  const bands = []

  /* Everything on the field is measured against the panel rather than in
     pixels: the table is one physical object whatever resolution is driving
     it, and 300px on a 1080 panel is 300px on a 4K one — a quarter of the
     size on the same 55 inches. The figures below are read as pixels on a
     1080-high table, which is the height the composition was drawn at. */
  const VMIN = 10.8
  const vmin = (px) => (px / VMIN).toFixed(3) + 'vmin'

  function makeBand(blur, fade) {
    const band = document.createElement('div')
    band.className = 'band'
    band.style.filter = 'blur(' + vmin(blur) + ')'
    band.style.opacity = fade.toFixed(2)
    depth.appendChild(band)
    return band
  }

  /* The depths, back to front — and in that order on the page too, so a near
     circle passes in front of a far one rather than behind it. That crossing
     is most of what makes the movement read as depth rather than as sliding. */
  for (let i = 0; i < BANDS; i += 1) {
    const off = Math.abs(i - FOCUS)
    const near = i / (BANDS - 1)
    bands.push({
      // Blur kept inside the range the atlas uses for its own field — past
      // about sixty the circles stop being circles and the whole thing turns
      // to wash. Opacity falls away from the focal plane in both directions:
      // the front band is large, blurred and painted over everything, and at
      // full strength it veils the one depth that is actually sharp.
      el: makeBand(13 + Math.pow(off, 1.5) * 9, 1 - off * 0.13),
      near: near,
      // How far this depth travels. The spread between the front and the back
      // is the parallax; the absolute figure is only how alive the table looks.
      drift: 12 + near * 70,
      phase: r() * Math.PI * 2,
    })
  }

  /* Placed across 124% of the table because that is how much of it each band
     covers — the layers hang past every edge so the drift never pulls one of
     them off the surface and leaves a bare corner behind it. */
  for (let k = 0; k < CIRCLES; k += 1) {
    const band = bands[Math.floor(r() * BANDS)]
    const el = document.createElement('span')
    el.className = 'node'
    el.style.left = r() * 100 + '%'
    el.style.top = r() * 100 + '%'
    // Nearer circles read larger, which is the other half of the depth.
    const size = (150 + r() * 320) * (0.72 + band.near * 0.5)
    el.style.width = vmin(size)
    el.style.height = vmin(size)
    el.style.background = 'var(' + TONES[Math.floor(r() * TONES.length)] + ')'
    el.style.opacity = (0.14 + r() * 0.3).toFixed(2)
    band.el.appendChild(el)
  }

  /* ── the drift ────────────────────────────────────────────────────────
     A table has no cursor to follow, so the field moves on its own: two slow
     cycles of different length per depth, which never quite repeat together,
     so the table never settles into a loop anyone can catch. Bands nearer the
     front travel further, which is the parallax.

     About a minute for the sideways cycle and half as fast again for the
     vertical. The front band peaks around eight pixels a second, which is
     under the rate at which something reads as moving and over the rate at
     which it reads as still: look at it and it is not moving, look away and
     the table has changed. Slower than this — it was six times slower — and
     there is no movement at all, only a screenshot that will not sit still. */
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches

  function frame(t) {
    const s = t / 1000
    for (let i = 0; i < bands.length; i += 1) {
      const b = bands[i]
      const x = Math.sin(s * 0.101 + b.phase) * b.drift
      const y = Math.cos(s * 0.073 + b.phase * 1.7) * b.drift * 0.6
      b.el.style.transform = 'translate3d(' + vmin(x) + ',' + vmin(y) + ',0)'
    }
    requestAnimationFrame(frame)
  }

  fit()
  addEventListener('resize', fit)
  if (!still) requestAnimationFrame(frame)
})()
</script>
