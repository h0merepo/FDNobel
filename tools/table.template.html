<title>Nobel Atlas — Table</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   THE TABLE

   One 55-inch surface, four people around it. Four copies of the atlas sit
   on top — two of them turned to face the other side of the table — and
   under all four runs a single connected plane of material that is out of
   reach: blurred, drifting, and never touchable.

   The four zones are windows onto the same build. It is carried inline
   rather than framed from its own page, because the artifact host answers
   with `frame-ancestors 'self'` and will not let one artifact embed
   another. Rebuild this file from the shortlist and all four update.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --table: #2b2825;
  --gold: #cea152;
  --pale: #d1ccbe;
  --warm: #b0a8a1;
  --pink: #f5318b;
  --physics: #a6a6a6;
  --chemistry: #0c3d51;
  --medicine: #2c8293;
  --literature: #c25f1b;
  --peace: #bac9d9;
  --economics: #96ae7e;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--table);
  font-family: 'Alfred Sans', system-ui, sans-serif;
  color: var(--pale);
  -webkit-font-smoothing: antialiased;
}

.table {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ── the plane out of reach ──────────────────────────────────────────────
   Six bands at six depths. Each carries its own blur and its own rate of
   drift, so the whole thing separates the way a lens separates it: one band
   near focus, everything in front of and behind it falling away. Nothing
   here takes a touch — the surface belongs to the four zones. */
.depth {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* Each layer stands 124% of the table and hangs 12% past every edge, so it
   still covers the surface once the drift has pushed it. Given as insets, not
   as a width with a negative margin: a percentage margin resolves against the
   containing block's width in both axes, which on a 16:9 table lifts every
   layer most of a screen height out of place. */
.band {
  position: absolute;
  inset: -12%;
  will-change: transform;
}

.band svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.band .node {
  position: absolute;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

/* Fragments of the record: titles, journals, dates. Set small enough to be
   read as texture from a standing distance and as words from a seated one.
   Sized against the panel, not in pixels: the table is one physical object
   whatever the resolution driving it, and 13px on a 1080 panel is 13px on a
   4K one — a quarter of the size on the same 55 inches. */
.band .note {
  position: absolute;
  width: 14ch;
  overflow-wrap: anywhere; /* a long German title must not run into its neighbour */
  transform: translate(-50%, -50%);
  font-size: 1.2vmin;
  line-height: 1.35;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(209, 204, 190, 0.62);
}

/* ── the four zones ──────────────────────────────────────────────────────
   Flush to the table, no frame and no shadow: the atlas's own ground is a
   shade off the table's, so a zone reads as a window cut in the surface
   rather than as a panel laid on it. */
.zones {
  position: absolute;
  inset: 0;
}

.zone {
  position: absolute;
  width: 41%;
  height: 38%;
  overflow: hidden;
  background: #262320;
}

.zone.left { left: 4.5%; }
.zone.right { right: 4.5%; }
.zone.top { top: 3%; }
.zone.bottom { bottom: 3%; }

/* Two of the four face the other side of the table. */
.zone.turned { transform: rotate(180deg); }

/* The atlas lays itself out differently below a certain width, so each zone
   runs it at a thousand logical pixels and scales that to the slot — up as
   well as down. The table is one physical object; a 4K panel should show the
   same composition as a 1080 one at the same size on the glass, not the same
   layout at half of it. Scaling a live document keeps its text vector, so
   magnifying it costs no sharpness. */
.fit {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
}

.fit iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

@media (prefers-reduced-motion: reduce) {
  .band { transition: none; }
}
</style>

<div class="table">
  <div class="depth" id="depth"></div>

  <div class="zones">
    <div class="zone top left turned"><div class="fit"><iframe title="Nobel Atlas"></iframe></div></div>
    <div class="zone top right turned"><div class="fit"><iframe title="Nobel Atlas"></iframe></div></div>
    <div class="zone bottom left"><div class="fit"><iframe title="Nobel Atlas"></iframe></div></div>
    <div class="zone bottom right"><div class="fit"><iframe title="Nobel Atlas"></iframe></div></div>
  </div>
</div>

<script id="app" type="application/octet-stream">__APP_B64__</script>

<script>
(function () {
  'use strict'

  /* ── the atlas, into all four zones ───────────────────────────────────
     Written into each frame as a real document rather than handed over as
     an attribute: a build this long parses either way, but only a real
     parse runs the scripts it is built on. The four are staggered so the
     panel is not asked to parse four of them in the same frame. */
  const html = new TextDecoder().decode(
    Uint8Array.from(atob(document.getElementById('app').textContent.trim()), (c) => c.charCodeAt(0)),
  )

  const frames = [].slice.call(document.querySelectorAll('.fit iframe'))
  frames.forEach(function (frame, i) {
    setTimeout(function () {
      const doc = frame.contentDocument
      if (!doc) return
      doc.open()
      doc.write(html)
      doc.close()
    }, i * 220)
  })

  /* ── each zone scales its copy to its slot ─────────────────────────── */
  const LOGICAL = 1000

  function fit() {
    document.querySelectorAll('.zone').forEach(function (zone) {
      const box = zone.getBoundingClientRect()
      if (!box.width) return
      const scale = box.width / LOGICAL
      const inner = zone.querySelector('.fit')
      inner.style.width = box.width / scale + 'px'
      inner.style.height = box.height / scale + 'px'
      inner.style.transform = 'scale(' + scale.toFixed(4) + ')'
    })
  }

  /* ── the plane out of reach ───────────────────────────────────────────
     One network, not six: every node belongs to the same web, and the lines
     between them are drawn once on a layer of their own so the connection
     stays legible. Only the nodes are sorted into depth bands, which is what
     puts them in and out of focus — the way a lens separates a scene it is
     still looking at all of. Generated from one seed, so the table comes up
     the same every time it is switched on. */
  function rng(seed) {
    let h = 2166136261
    for (let i = 0; i < seed.length; i += 1) {
      h ^= seed.charCodeAt(i)
      h = Math.imul(h, 16777619)
    }
    return function () {
      h = Math.imul(h ^ (h >>> 15), h | 1)
      h ^= h + Math.imul(h ^ (h >>> 7), h | 61)
      return ((h ^ (h >>> 14)) >>> 0) / 4294967296
    }
  }

  const TONES = [
    '--gold', '--pale', '--warm', '--pink', '--physics',
    '--chemistry', '--medicine', '--literature', '--peace', '--economics',
  ]

  /* What the archive holds, in the words it holds it under. */
  const NOTES = [
    'Governing the Commons: the Evolution of Institutions for Collective Action',
    'On a New Kind of Rays — Würzburg, 28 December 1895',
    'Poverty and Famines: an Essay on Entitlement and Deprivation',
    'A Programmable Dual-RNA-Guided DNA Endonuclease — Science, 17 August 2012',
    'Russell–Einstein Manifesto — London, 9 July 1955',
    'On the Antibacterial Action of Cultures of a Penicillium, 1929',
    'Über quantentheoretische Umdeutung — Helgoland, June 1925',
    'Induction of Pluripotent Stem Cells from Mouse Fibroblast Cultures',
    'Die Waffen nieder! — Vienna, 1889',
    "Nobel's Will — Paris, 27 November 1895",
    'Highly Accurate Protein Structure Prediction — CASP14, 2020',
  ]

  const BANDS = 6
  const FOCUS = 4 // the depth the lens is held at; the rest falls away from it
  const NODES = 52

  const depth = document.getElementById('depth')
  const r = rng('nobel-atlas-table')
  const bands = []
  const ns = 'http://www.w3.org/2000/svg'

  /* Everything on the plane is measured against the panel rather than in
     pixels — see the note on .note. The figures below are read as pixels on a
     1080-high table and converted, which is the height the composition was
     drawn at. */
  const VMIN = 10.8
  const vmin = (px) => (px / VMIN).toFixed(3) + 'vmin'

  function makeBand(blur, fade) {
    const band = document.createElement('div')
    band.className = 'band'
    band.style.filter = 'blur(' + vmin(blur) + ')'
    band.style.opacity = fade.toFixed(2)
    depth.appendChild(band)
    return band
  }

  // the bands the nodes fall into, back to front
  for (let i = 0; i < BANDS; i += 1) {
    const off = Math.abs(i - FOCUS)
    bands.push({
      el: makeBand(Math.pow(off, 1.35) * 9 + 1, 0.52 + (1 - off / BANDS) * 0.34),
      near: 1 - i / (BANDS - 1),
      drift: 5 + (1 - i / (BANDS - 1)) * 26,
      phase: r() * Math.PI * 2,
    })
  }

  // the one layer the whole web is drawn on, held near focus so it reads
  const webBand = { el: makeBand(1.4, 0.82), drift: bands[FOCUS].drift, phase: r() * Math.PI * 2 }
  bands.push(webBand)
  const web = document.createElementNS(ns, 'svg')
  web.setAttribute('preserveAspectRatio', 'none')
  web.setAttribute('viewBox', '0 0 100 100')
  webBand.el.appendChild(web)

  // --- the nodes, scattered through the depths -------------------------
  const nodes = []
  for (let k = 0; k < NODES; k += 1) {
    const band = Math.floor(r() * BANDS)
    const near = bands[band].near
    const size = (44 + Math.pow(near, 1.7) * 360) * (0.55 + r() * 0.95)
    const node = { x: 3 + r() * 94, y: 3 + r() * 94, band: band, size: size }
    nodes.push(node)

    const el = document.createElement('span')
    el.className = 'node'
    el.style.left = node.x + '%'
    el.style.top = node.y + '%'
    el.style.width = vmin(size)
    el.style.height = vmin(size)
    el.style.background = 'var(' + TONES[Math.floor(r() * TONES.length)] + ')'
    el.style.opacity = (0.3 + r() * 0.32).toFixed(2)
    bands[band].el.appendChild(el)
  }

  // --- and the ties between them, on the web's own layer ----------------
  for (let a = 0; a < nodes.length; a += 1) {
    const near = nodes
      .map(function (n, j) { return { n: n, j: j, d: Math.hypot(n.x - nodes[a].x, n.y - nodes[a].y) } })
      .filter(function (o) { return o.j !== a })
      .sort(function (p, q) { return p.d - q.d })
    const reach = a % 4 === 0 ? 3 : 2 // every fourth node keeps a longer tie
    for (let t = 0; t < reach && t < near.length; t += 1) {
      if (near[t].d > 46) continue
      const line = document.createElementNS(ns, 'line')
      line.setAttribute('x1', nodes[a].x)
      line.setAttribute('y1', nodes[a].y)
      line.setAttribute('x2', near[t].n.x)
      line.setAttribute('y2', near[t].n.y)
      line.setAttribute('stroke', 'rgba(209,204,190,0.42)')
      line.setAttribute('vector-effect', 'non-scaling-stroke')
      line.style.strokeWidth = vmin(1)
      web.appendChild(line)
    }
  }

  /* One fragment held in focus among all the softness: a plate, close
     enough to see the grain on and still out of reach. */
  const grain = document.createElementNS(ns, 'svg')
  grain.setAttribute('viewBox', '0 0 100 100')
  grain.setAttribute(
    'style',
    'position:absolute;left:50%;top:62.1%;width:' + vmin(104) + ';height:' + vmin(104) +
      ';transform:translate(-50%,-50%);opacity:.5',
  )
  grain.innerHTML =
    '<defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="7"/>' +
    '<feColorMatrix type="saturate" values="0"/></filter>' +
    '<clipPath id="gclip"><circle cx="50" cy="50" r="50"/></clipPath></defs>' +
    '<g clip-path="url(#gclip)"><rect width="100" height="100" filter="url(#grain)"/></g>'
  webBand.el.appendChild(grain)

  /* The record itself, where it can almost be read. The four zones cover most
     of the table, so the fragments are laid in the cross of bare surface they
     leave — the wide band between the near and far pairs, the seam down the
     middle, and the margins. Placed anywhere else they would be true of the
     plane and invisible on it. Gaps are given in table per cent and mapped onto
     the layer, which stands 124% of the table and hangs 12% past each edge, so
     a point at T% of the table sits at (T + 12) / 1.24 of the layer. */
  const onLayer = (t) => (t + 12) / 1.24 + '%'

  /* Slots rather than loose points: a fragment set down at random lands on
     the one beside it often enough, and two of these overlapping is not
     texture, it is a smudge. Eight sit along the band, three down the seam. */
  const SLOTS = [
    [10, 50], [21, 48], [32, 51], [43, 49], [58, 50], [69, 48], [80, 51], [91, 49],
    [50, 16], [50, 33], [50, 78],
  ]

  NOTES.forEach(function (text, i) {
    const slot = SLOTS[i % SLOTS.length]
    const note = document.createElement('p')
    note.className = 'note'
    note.textContent = text
    note.style.left = onLayer(slot[0] + (r() - 0.5) * 3)
    note.style.top = onLayer(slot[1] + (r() - 0.5) * 3)
    note.style.opacity = (0.45 + r() * 0.4).toFixed(2)
    webBand.el.appendChild(note)
  })

  /* ── the drift ────────────────────────────────────────────────────────
     A table has no cursor to follow, so the plane moves on its own: two
     slow cycles of different length per band, which never quite repeat
     together. Bands nearer the front travel further, which is the parallax. */
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches

  function frame(t) {
    const s = t / 1000
    for (let i = 0; i < bands.length; i += 1) {
      const b = bands[i]
      const x = Math.sin(s * 0.043 + b.phase) * b.drift
      const y = Math.cos(s * 0.031 + b.phase * 1.7) * b.drift * 0.6
      b.el.style.transform = 'translate3d(' + vmin(x) + ',' + vmin(y) + ',0)'
    }
    requestAnimationFrame(frame)
  }

  fit()
  addEventListener('resize', fit)
  if (!still) requestAnimationFrame(frame)
})()
</script>
